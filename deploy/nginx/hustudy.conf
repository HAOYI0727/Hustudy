# Example only: replace domain/certificate paths after obtaining a certificate.
server {
    listen 80;
    server_name study.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name study.example.com;
    ssl_certificate /etc/letsencrypt/live/study.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/study.example.com/privkey.pem;

    root /opt/hustudy/frontend/dist;
    index index.html;
    # Each request contains one file, at most 30 MiB plus multipart overhead.
    client_max_body_size 35m;
    add_header X-Content-Type-Options nosniff;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
    location = /health {
        proxy_pass http://127.0.0.1:8000;
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
